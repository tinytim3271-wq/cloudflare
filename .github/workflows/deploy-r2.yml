name: Build and deploy to Cloudflare R2
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: |
          dotnet restore diagnostics/j2534-service/J2534Service.sln
          dotnet build diagnostics/j2534-service/J2534Service.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish diagnostics/j2534-service/J2534Service.sln -c Release -o ./artifacts/publish

      - name: Create zip
        run: |
          cd artifacts
          apt-get update && apt-get install -y zip
          zip -r publish.zip publish

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install AWS CLI via pip
        run: |
          python -m pip install --upgrade pip awscli

      - name: Upload zip to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -eu
          R2_ENV_FILE="$RUNNER_TEMP/r2-upload-env"
          node scripts/resolve-r2-upload-env.mjs "$R2_ENV_FILE"
          . "$R2_ENV_FILE"
          if [ "${SKIP_UPLOAD}" = "1" ]; then
            echo "::notice title=R2 upload skipped::${SKIP_REASON}"
            exit 0
          fi
          echo "Resolved R2 upload target configuration."
          aws --version
          KEY="j2534-service/publish-${{ github.run_id }}.zip"
          OBJECT_KEY_PATH="$BUCKET/$KEY"
          OBJECT_PATH="s3://$BUCKET/$KEY"
          UPLOAD_STDERR="$RUNNER_TEMP/r2-upload.stderr"
          if ! aws --endpoint-url "https://${ACCOUNT_ID}.r2.cloudflarestorage.com" s3 cp artifacts/publish.zip "$OBJECT_PATH" >/dev/null 2>"$UPLOAD_STDERR"; then
            python - "$UPLOAD_STDERR" "$ACCOUNT_ID" "$BUCKET" "$OBJECT_PATH" "$OBJECT_KEY_PATH" <<'PY'
            import pathlib
            import sys

            log_path, account_id, bucket, object_path, object_key_path = sys.argv[1:]
            log_text = pathlib.Path(log_path).read_text(encoding='utf-8', errors='replace')
            sensitive_values = [
                object_path,
                object_key_path,
                f'https://{account_id}.r2.cloudflarestorage.com' if account_id else '',
                f'{account_id}.r2.cloudflarestorage.com' if account_id else '',
                f's3://{bucket}' if bucket else '',
                account_id,
                bucket,
            ]
            for value in sensitive_values:
                if value:
                    log_text = log_text.replace(value, '[REDACTED]')
            if log_text.strip():
                print(log_text.rstrip())
            PY
            echo "::error title=R2 upload failed::Artifact upload to Cloudflare R2 failed."
            exit 1
          fi
          echo "Uploaded publish artifact to Cloudflare R2."
