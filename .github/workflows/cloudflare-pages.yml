name: Cloudflare deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'theme.css'
      - 'service-worker.js'
      - 'diagnostics-ui.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'theme.css'
      - 'service-worker.js'
      - 'diagnostics-ui.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:config
      - run: npm run test:worker
      - run: npm run stage:pages
      - run: npx wrangler deploy --dry-run

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CLOUDFLARE_DEPLOY_ENABLED != 'false'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying."
            echo "Set variable CLOUDFLARE_DEPLOY_ENABLED=false only if you need to skip publish."
            exit 1
          fi
      - name: Configure D1 binding and CORS origins
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_ALLOWED_ORIGINS: ${{ vars.CLOUDFLARE_ALLOWED_ORIGINS }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          // Strip JSONC comments for parsing, then write pretty JSON (wrangler accepts JSON).
          const raw = fs.readFileSync(path, 'utf8');
          const jsonText = raw
            .replace(/\/\*[\s\S]*?\*\//g, '')
            .replace(/^\s*\/\/.*$/gm, '');
          const config = JSON.parse(jsonText);
          const placeholder = '00000000-0000-0000-0000-000000000000';
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          const d1 = (config.d1_databases || [])[0];
          if (!d1) {
            console.error('wrangler.jsonc is missing d1_databases[0]');
            process.exit(1);
          }
          if (databaseId) {
            d1.database_id = databaseId;
          }
          if (!d1.database_id || d1.database_id === placeholder) {
            console.error('Set CLOUDFLARE_D1_DATABASE_ID or put a real D1 id in wrangler.jsonc');
            process.exit(1);
          }
          if (process.env.CLOUDFLARE_ALLOWED_ORIGINS) {
            // Replace the full ALLOWED_ORIGINS value (comma-separated list), not a substring.
            config.vars = config.vars || {};
            config.vars.ALLOWED_ORIGINS = process.env.CLOUDFLARE_ALLOWED_ORIGINS;
          }
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`D1 database_id=${d1.database_id}`);
          console.log(`ALLOWED_ORIGINS=${config.vars?.ALLOWED_ORIGINS || '(unchanged)'}`);
          NODE
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Build and stage Pages
        run: npm run build:web && npm run stage:pages
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mechpro-dispatch' }} --commit-dirty=true
