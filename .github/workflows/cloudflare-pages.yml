name: Cloudflare deploy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'theme.css'
      - 'service-worker.js'
      - 'diagnostics-ui.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'theme.css'
      - 'service-worker.js'
      - 'diagnostics-ui.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'public/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:config
      - run: npm run test:worker
      - run: npm run stage:pages
      - run: npx wrangler deploy --dry-run

  publish:
    # Job-level `if` cannot read `secrets` (GitHub rejects the workflow with 0 jobs).
    # Gate deploy steps on a step output instead so missing credentials skip, not fail.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.CLOUDFLARE_DEPLOY_ENABLED != 'false'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare publish skipped::Add repository secret CLOUDFLARE_API_TOKEN (Workers Scripts, D1, R2, Pages edit). CLOUDFLARE_ACCOUNT_ID can be a variable or secret. Then re-run this workflow."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.creds.outputs.present == 'true'
        run: npm ci
      - name: Configure D1 binding
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_ALLOWED_ORIGINS: ${{ vars.CLOUDFLARE_ALLOWED_ORIGINS }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let source = fs.readFileSync(path, 'utf8');
          const placeholder = '00000000-0000-0000-0000-000000000000';
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (databaseId) {
            source = source.replace(/"database_id":\s*"[^"]+"/, `"database_id": "${databaseId}"`);
          }
          if (source.includes(placeholder)) {
            console.error('Set CLOUDFLARE_D1_DATABASE_ID or put a real D1 id in wrangler.jsonc');
            process.exit(1);
          }
          if (process.env.CLOUDFLARE_ALLOWED_ORIGINS) {
            source = source.replace('https://mechpro-dispatch.pages.dev', process.env.CLOUDFLARE_ALLOWED_ORIGINS);
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Apply D1 migrations
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
      - name: Deploy API Worker
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Build and stage Pages
        if: steps.creds.outputs.present == 'true'
        run: npm run build:web && npm run stage:pages
      - name: Deploy Pages
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'mechpro-dispatch' }} --commit-dirty=true
