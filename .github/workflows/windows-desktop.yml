name: Windows desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'

permissions:
  contents: read

jobs:
  build-j2534:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish J2534.Host.exe
        shell: pwsh
        run: ./diagnostics/j2534-service/scripts/publish-win-x64.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64/J2534.Host.exe

  build-installer:
    needs: build-j2534
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npm run build:web
      - name: Build NSIS installer and portable zip
        run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mechpro-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  publish-github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="desktop-v1.0.0"
          REPO="${{ github.repository }}"
          NOTES="Automated Windows build from ${GITHUB_SHA}. Includes J2534 OEM Diagnostics and 64-bit Windows adapter detection (WOW6432Node)."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/windows/*.exe dist/windows/*.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/windows/*.exe dist/windows/*.zip \
              --repo "$REPO" \
              --title "MechPro Desktop 1.0.0" \
              --notes "$NOTES"
          fi

  publish-download:
    # Job-level `if` cannot read `secrets`; skip the R2 upload in a step instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=R2 installer publish skipped::Add repository secret CLOUDFLARE_API_TOKEN to publish the Windows installer to R2."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - name: Publish Windows installer exe to R2
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ vars.CLOUDFLARE_R2_BUCKET || 'mechpro-files' }}/downloads/MechPro-Setup-1.0.0.exe --remote --file dist/windows/MechPro-Setup-1.0.0.exe --content-type application/octet-stream --cache-control "public, max-age=300"
      - name: Publish Windows installer zip to R2
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put ${{ vars.CLOUDFLARE_R2_BUCKET || 'mechpro-files' }}/downloads/MechPro-Setup-1.0.0.zip --remote --file dist/windows/MechPro-Setup-1.0.0.zip --content-type application/zip --cache-control "public, max-age=300"
