name: Windows desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
      - 'src/**'
      - 'scripts/**'

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-j2534:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Publish J2534.Host.exe
        shell: pwsh
        run: ./diagnostics/j2534-service/scripts/publish-win-x64.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64/J2534.Host.exe

  build-installer:
    needs: build-j2534
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npm run build:web
      - name: Bake diagnostics capability secret for packaged desktop
        shell: bash
        env:
          DIAGNOSTICS_CAPABILITY_SECRET: ${{ secrets.DIAGNOSTICS_CAPABILITY_SECRET }}
        run: |
          if [ -z "${DIAGNOSTICS_CAPABILITY_SECRET:-}" ]; then
            echo "::warning title=Diagnostics capability secret missing::Add repository secret DIAGNOSTICS_CAPABILITY_SECRET (must match Worker) so Clear DTC works in packaged builds. Read-only J2534 ops still work."
          fi
          node scripts/bake-diagnostics-secret.mjs
      - name: Build NSIS installer and portable zip
        run: npx electron-builder --win nsis zip --publish never
      - name: Smoke test Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(ls dist/windows/*.exe | head -n1)"
          ZIP="$(ls dist/windows/*.zip | head -n1)"
          test -s "$EXE"
          test -s "$ZIP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mechpro-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  publish-github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="desktop-v${VERSION}"
          REPO="${{ github.repository }}"
          NOTES="Automated Windows build from ${GITHUB_SHA}. Includes J2534 OEM Diagnostics and 64-bit Windows adapter detection (WOW6432Node)."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/windows/*.exe dist/windows/*.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/windows/*.exe dist/windows/*.zip \
              --repo "$REPO" \
              --title "MechPro Desktop ${VERSION}" \
              --notes "$NOTES"
          fi

  publish-download:
    # Job-level `if` cannot read secrets; skip the R2 upload in a step instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=R2 installer publish skipped::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish the Windows installer to R2."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Windows installer to R2
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'mechpro-files' }}
        run: |
          set -u
          VERSION="$(node -p "require('./package.json').version")"
          if ! npx wrangler r2 object put "$R2_BUCKET/downloads/MechPro-Setup-${VERSION}.exe" --remote --file "dist/windows/MechPro-Setup-${VERSION}.exe" --content-type application/octet-stream --cache-control "public, max-age=300"; then
            echo "::warning title=R2 installer publish failed::Token lacks R2 write permission. GitHub Release assets are still published; upload the EXE/ZIP to R2 manually or grant Workers R2 write on CLOUDFLARE_API_TOKEN."
            exit 0
          fi
          npx wrangler r2 object put "$R2_BUCKET/downloads/MechPro-Setup-${VERSION}.zip" --remote --file "dist/windows/MechPro-Setup-${VERSION}.zip" --content-type application/zip --cache-control "public, max-age=300"
