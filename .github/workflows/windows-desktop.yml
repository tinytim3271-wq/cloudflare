name: Windows desktop release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
      - 'src/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-desktop.yml'
      - 'diagnostics/j2534-service/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'diagnostics-ui.js'
      - 'src/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build-j2534:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish J2534.Host.exe
        shell: pwsh
        run: ./diagnostics/j2534-service/scripts/publish-win-x64.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64/J2534.Host.exe

  build-installer:
    needs: build-j2534
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: j2534-host-win-x64
          path: diagnostics/j2534-service/publish/win-x64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npm run build:web
      - name: Build NSIS installer and portable zip
        run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mechpro-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.zip

  publish-github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="desktop-v${VERSION}"
          REPO="${{ github.repository }}"
          NOTES="Automated Windows build from ${GITHUB_SHA}. Includes J2534 OEM Diagnostics and 64-bit Windows adapter detection (WOW6432Node)."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/windows/*.exe dist/windows/*.zip --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/windows/*.exe dist/windows/*.zip \
              --repo "$REPO" \
              --title "MechPro Desktop ${VERSION}" \
              --notes "$NOTES"
          fi

  publish-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-installer
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mechpro-windows-installer
          path: dist/windows
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish Windows installer to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET || 'mechpro-files' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npx wrangler r2 object put "$R2_BUCKET/downloads/MechPro-Setup-${VERSION}.exe" --remote --file "dist/windows/MechPro-Setup-${VERSION}.exe" --content-type application/octet-stream --cache-control "public, max-age=300"
          npx wrangler r2 object put "$R2_BUCKET/downloads/MechPro-Setup-${VERSION}.zip" --remote --file "dist/windows/MechPro-Setup-${VERSION}.zip" --content-type application/zip --cache-control "public, max-age=300"
