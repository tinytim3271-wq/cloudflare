<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a MechPro shop</title>
    <link rel="icon" href="/mechpro-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/fonts/fonts.css" />
    <link rel="stylesheet" href="/market.css" />
  </head>
  <body class="auth-screen">
    <main class="auth-card">
      <a class="brand" href="/features"><span class="brand-mark">M</span><span><strong>MECHPRO</strong><small>Shop operating system</small></span></a>
      <h1>Create your shop</h1>
      <p>Start a 14-day trial. You will sign in with a one-time link sent to the owner email. Add employees after the shop exists.</p>
      <form method="post" action="/api/auth/magic-link">
        <label for="shopName">Shop name<input id="shopName" type="text" name="shopName" placeholder="Your Car Guy" required /></label>
        <label for="ownerName">Owner name<input id="ownerName" type="text" name="ownerName" autocomplete="name" required /></label>
        <label for="email">Owner email<input id="email" type="email" name="email" autocomplete="email" placeholder="owner@yourshop.com" required /></label>
        <input type="hidden" name="returnTo" value="/app" />
        <button class="btn primary" type="submit">Start trial</button>
      </form>
      <div class="auth-links">
        <a href="/login">I already have an account</a>
        <a href="/pricing">Compare plans</a>
      </div>
    </main>
  </body>
</html>
